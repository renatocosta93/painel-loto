name: Atualizador Diário Lotorama
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Extrair Dados do Lotorama
        run: |
          cat << 'EOF' > script.js
          const fs = require('fs');

          async function run() {
              console.log("Iniciando extração direta do Lotorama (Ano 2026)...");
              try {
                  // Acessa a página combinada
                  let res = await fetch('https://lotorama.com.br/lotofacil/todos-os-resultados/?ano=2026', {
                      headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' }
                  });
                  let html = await res.text();
                  
                  // Busca todas as linhas da tabela de resultados
                  let rows = html.match(/<tr[^>]*>[\s\S]*?<\/tr>/gi);
                  let jogosCapturados = [];
                  
                  if(rows) {
                      for(let row of rows) {
                          let cols = row.match(/<td[^>]*>([\s\S]*?)<\/td>/gi);
                          // Se a linha tem as colunas corretas (Concurso, Data, Dezenas...)
                          if(cols && cols.length >= 3) {
                              let concText = cols[0].replace(/<[^>]+>/g, '').trim();
                              let dataText = cols[1].replace(/<[^>]+>/g, '').trim();
                              
                              // Junta o restante das colunas para procurar as dezenas
                              let numsText = "";
                              for(let i=2; i<cols.length; i++) {
                                  numsText += " " + cols[i].replace(/<[^>]+>/g, '').trim();
                              }
                              
                              let concurso = parseInt(concText);
                              // Filtra exatamente os números de 01 a 25
                              let dezenas = numsText.match(/\b(0[1-9]|1[0-9]|2[0-5]|[1-9])\b/g);
                              
                              if(concurso && dezenas && dezenas.length === 15) {
                                  jogosCapturados.push({
                                      concurso: concurso,
                                      data: dataText,
                                      dezenas: dezenas.map(Number).sort((a,b)=>a-b)
                                  });
                              }
                          }
                      }
                  }
                  
                  if(jogosCapturados.length > 0) {
                      // Ordena do concurso mais novo para o mais velho, por precaução
                      jogosCapturados.sort((a, b) => b.concurso - a.concurso);
                      
                      // Separa estritamente os últimos 50 jogos
                      let tabelaFinal = jogosCapturados.slice(0, 50);
                      
                      // Salva escrevendo por cima do arquivo resultados.json
                      fs.writeFileSync('resultados.json', JSON.stringify(tabelaFinal, null, 2));
                      console.log("Sucesso! Tabela recriada com os " + tabelaFinal.length + " últimos concursos.");
                      console.log("Concurso mais recente no topo: " + tabelaFinal[0].concurso);
                  } else {
                      console.log("Erro: Não foi possível ler as dezenas no HTML do site.");
                      process.exit(1);
                  }
                  
              } catch(e) {
                  console.log("Falha ao tentar acessar o site do Lotorama:", e);
                  process.exit(1);
              }
          }
          run();
          EOF
          node script.js
      - name: Salvar Tabela Atualizada
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Robo Atualizador"
          git add resultados.json
          git commit -m "Auto: Tabela de 50 jogos atualizada via Lotorama" || echo "Sem mudanças hoje"
          git push
