name: Atualizador Diário
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Motor de Sincronizacao
        run: |
          cat << 'EOF' > script.js
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';
          const fs = require('fs');

          async function fetchLoto(concurso = '') {
              const endpoint = concurso ? `/${concurso}` : '';
              const urls = [
                  `https://loterias-api.brchallenges.com/api/lotofacil${endpoint}`,
                  `https://brasilapi.com.br/api/loterias/v1/lotofacil${endpoint}`,
                  `https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil${endpoint}`
              ];
              
              for (let u of urls) {
                  try {
                      let res = await fetch(u, { 
                          headers: { 
                              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
                              'Accept': 'application/json'
                          },
                          signal: AbortSignal.timeout(6000)
                      });
                      if (res.ok) {
                          let data = await res.json();
                          let num = data.concurso || data.numero;
                          let dezenas = data.dezenas || data.listaDezenas;
                          let dataSorteio = data.data || data.dataApuracao;
                          if (num && dezenas && dezenas.length === 15) {
                              return {
                                  concurso: num,
                                  data: dataSorteio,
                                  dezenas: (typeof dezenas[0] === 'string' ? dezenas.map(Number) : dezenas).sort((a,b)=>a-b)
                              };
                          }
                      }
                  } catch (e) {}
              }
              return null;
          }

          async function run() {
              console.log("Acionando modo Reconstrução Auto-Curativa...");
              
              let historico = [];
              try {
                  if (fs.existsSync('resultados.json')) {
                      let txt = fs.readFileSync('resultados.json', 'utf8');
                      if(txt.trim()) historico = JSON.parse(txt);
                  }
              } catch(e) {
                  console.log("Aviso: arquivo anterior inválido. Uma nova tabela será criada.");
              }

              let ultimo = await fetchLoto('');
              if (!ultimo) {
                  console.log("Erro Crítico: Todas as fontes oficiais bloqueadas no momento.");
                  process.exit(1);
              }
              
              console.log(`Último concurso oficial detectado: ${ultimo.concurso}`);

              let mapHist = {};
              for (let j of historico) {
                  if (j && j.concurso) mapHist[j.concurso] = j;
              }

              let novaTabela = [];
              
              // Reconstrói exatamente 50 jogos olhando a matriz
              for (let i = 0; i < 50; i++) {
                  let alvo = ultimo.concurso - i;
                  if (alvo < 1) break;
                  
                  if (mapHist[alvo] && mapHist[alvo].dezenas && mapHist[alvo].dezenas.length === 15) {
                      // Já tem o jogo, só copia
                      novaTabela.push(mapHist[alvo]);
                  } else {
                      // Não tem, faz o download do concurso que faltou
                      console.log(`Sincronizando concurso faltante (${alvo})...`);
                      let draw = await fetchLoto(alvo);
                      if (draw) {
                          novaTabela.push(draw);
                      } else {
                          console.log(`Aviso: Concurso ${alvo} não encontrado. Pulando.`);
                      }
                      await new Promise(r => setTimeout(r, 800)); // Pequena pausa para a Caixa não bloquear o robô
                  }
              }

              if (novaTabela.length > 0) {
                  fs.writeFileSync('resultados.json', JSON.stringify(novaTabela, null, 2));
                  console.log(`Tabela perfeitamente consolidada com ${novaTabela.length} jogos.`);
              } else {
                  console.log("Erro: Não foi possível construir a tabela.");
                  process.exit(1);
              }
          }

          run();
          EOF
          node script.js
      - name: Publicar Tabela Consolidada
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Robo Lotofacil"
          git add resultados.json
          git commit -m "Auto: Tabela consolidada com ultimos 50 jogos" || echo "Sem mudanças"
          git push
