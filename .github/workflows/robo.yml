name: Atualizador Diário
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Sincronização e Assistente IA
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > script.js
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';
          const fs = require('fs');

          function toBRL(valor) { return "R$ " + Number(valor).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

          async function fetchLoto(concurso = '') {
              const endpoint = concurso ? `/${concurso}` : '';
              const urls = [`https://loterias-api.brchallenges.com/api/lotofacil${endpoint}`, `https://brasilapi.com.br/api/loterias/v1/lotofacil${endpoint}`, `https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil${endpoint}`];
              for (let u of urls) {
                  try {
                      let res = await fetch(u, { headers: { 'User-Agent': 'Mozilla/5.0' }, signal: AbortSignal.timeout(8000) });
                      if (res.ok) {
                          let data = await res.json();
                          let num = data.concurso || data.numero;
                          let dezenas = data.dezenas || data.listaDezenas;
                          if (num && dezenas && dezenas.length === 15) {
                              let acumulou = data.acumulou || false;
                              let ganhadores15 = 0; let premio15 = 0;
                              let premiacaoArray = data.premiacoes || data.premiacao || data.listaRateioPremio || [];
                              if (premiacaoArray.length > 0) {
                                  let p15 = premiacaoArray.find(p => p.acertos === 15 || p.faixa === 1) || premiacaoArray[0];
                                  ganhadores15 = p15.vencedores || p15.ganhadores || p15.numeroDeGanhadores || data.quantidadeGanhadores || 0;
                                  premio15 = p15.valorPremio || p15.premio || data.valorPremio || 0;
                              } else {
                                  ganhadores15 = data.quantidadeGanhadores || data.ganhadores || 0;
                                  premio15 = data.valorPremio || data.premio || 0;
                              }
                              return {
                                  concurso: num, data: data.data || data.dataApuracao, dezenas: (typeof dezenas[0] === 'string' ? dezenas.map(Number) : dezenas).sort((a,b)=>a-b),
                                  acumulou: acumulou, ganhadores: ganhadores15, premio: premio15,
                                  proxConcurso: data.proximoConcurso || data.numeroConcursoProximo || (num + 1),
                                  proxData: data.dataProximoConcurso || data.dataProximoSorteio || "A definir",
                                  proxPremio: data.valorEstimadoProximoConcurso || data.valorEstimadoProximoSorteio || 0
                              };
                          }
                      }
                  } catch (e) {}
              } return null;
          }

          async function run() {
              let historico = [];
              if (fs.existsSync('resultados.json')) { try { historico = JSON.parse(fs.readFileSync('resultados.json', 'utf8')); } catch(e) {} }

              let ultimo = await fetchLoto(''); if (!ultimo) process.exit(1);
              let mapHist = {}; for (let j of historico) if (j && j.concurso) mapHist[j.concurso] = j;

              let novaTabela = [];
              for (let i = 0; i < 50; i++) {
                  let alvo = ultimo.concurso - i; if (alvo < 1) break;
                  if (i === 0) novaTabela.push(ultimo);
                  else if (mapHist[alvo] && mapHist[alvo].dezenas) novaTabela.push(mapHist[alvo]);
                  else { let draw = await fetchLoto(alvo); if (draw) novaTabela.push(draw); await new Promise(r => setTimeout(r, 800)); }
              }
              fs.writeFileSync('resultados.json', JSON.stringify(novaTabela, null, 2));

              // --- ASSISTENTE DE INSIGHTS ESTATÍSTICOS ---
              let stats = {}; for(let n=1; n<=25; n++) stats[n] = { history: [], freq: 0 };
              for(let i=0; i<novaTabela.length; i++) {
                  for(let n=1; n<=25; n++) { 
                      let drawn = novaTabela[i].dezenas.includes(n);
                      stats[n].history.push(drawn);
                      if(drawn) stats[n].freq++;
                  }
              }
              
              // Lógica de Ciclo (Viagem no tempo do mais antigo pro mais novo)
              let histAsc = [...novaTabela].reverse();
              let ciclosFechados = [];
              let setC = new Set();
              let contC = 0;
              for(let s of histAsc) {
                  contC++;
                  s.dezenas.forEach(d => setC.add(d));
                  if(setC.size === 25) {
                      ciclosFechados.push(contC);
                      setC.clear();
                      contC = 0;
                  }
              }
              let faltamCiclo = [];
              for(let i=1; i<=25; i++) { if(!setC.has(i)) faltamCiclo.push(i); }

              // Atrasos e Quebras
              let atrasosForte = []; let quebrasForte = [];
              for(let n=1; n<=25; n++) {
                  stats[n].history.reverse(); 
                  let aSeq = 0, cSeq = 0, mAbs = 0, mCons = 0;
                  for(let j=0; j<stats[n].history.length; j++) {
                      if(stats[n].history[j]) { cSeq++; aSeq = 0; if(cSeq > mCons) mCons = cSeq; } 
                      else { aSeq++; cSeq = 0; if(aSeq > mAbs) mAbs = aSeq; }
                  }
                  
                  let curA = 0; for(let j=stats[n].history.length-1; j>=0; j--) { if(!stats[n].history[j]) curA++; else break; }
                  let curC = 0; for(let j=stats[n].history.length-1; j>=0; j--) { if(stats[n].history[j]) curC++; else break; }
                  
                  if(curA >= mAbs - 1 && curA >= 2) {
                      let total = 0; let hits = 0; let temp = 0;
                      for(let j=0; j<stats[n].history.length - 1; j++) {
                          if(!stats[n].history[j]) temp++; else temp = 0;
                          if(temp === curA) { total++; if(stats[n].history[j+1]) hits++; }
                      }
                      let taxa = total > 0 ? Math.round((hits/total)*100) : 100;
                      atrasosForte.push({d: n, val: curA, max: mAbs, taxa: taxa});
                  }
                  
                  if(curC >= mCons - 1 && curC >= 3) {
                      let total = 0; let fails = 0; let temp = 0;
                      for(let j=0; j<stats[n].history.length - 1; j++) {
                          if(stats[n].history[j]) temp++; else temp = 0;
                          if(temp === curC) { total++; if(!stats[n].history[j+1]) fails++; }
                      }
                      let taxa = total > 0 ? Math.round((fails/total)*100) : 100;
                      quebrasForte.push({d: n, val: curC, max: mCons, taxa: taxa});
                  }
              }
              atrasosForte.sort((a,b) => b.taxa - a.taxa); quebrasForte.sort((a,b) => b.taxa - a.taxa);

              // Gerador do Palpite Ideal
              let palpite = new Set();
              atrasosForte.forEach(a => palpite.add(a.d));
              faltamCiclo.forEach(c => { if(palpite.size < 15 && !quebrasForte.some(q=>q.d===c)) palpite.add(c); });
              let rankingDezenas = Object.keys(stats).map(n => ({d: Number(n), freq: stats[n].freq})).sort((a,b) => b.freq - a.freq).map(r=>r.d);
              for(let n of rankingDezenas) {
                  if(palpite.size >= 15) break;
                  if(!quebrasForte.some(q=>q.d===n)) palpite.add(n);
              }
              let palpiteStr = Array.from(palpite).sort((a,b)=>a-b).map(n=>n<10?'0'+n:n).join(' ');

              // Análise do Mapa de Calor (Últimos 10)
              let hmStats = { l1:0, l2:0, l3:0, l4:0, l5:0 }; 
              for(let i=0; i<10; i++) {
                  if(!novaTabela[i]) break;
                  novaTabela[i].dezenas.forEach(d => {
                      if(d<=5) hmStats.l1++; else if(d<=10) hmStats.l2++; else if(d<=15) hmStats.l3++; else if(d<=20) hmStats.l4++; else hmStats.l5++;
                  });
              }
              let linhas = [
                  {n: 'Linha 1 (01 ao 05)', v: hmStats.l1}, {n: 'Linha 2 (06 ao 10)', v: hmStats.l2},
                  {n: 'Linha 3 (11 ao 15)', v: hmStats.l3}, {n: 'Linha 4 (16 ao 20)', v: hmStats.l4}, {n: 'Linha 5 (21 ao 25)', v: hmStats.l5}
              ];
              linhas.sort((a,b) => b.v - a.v); let lForte = linhas[0]; let lFraca = linhas[4];

              // Montando o texto do Assistente
              let insight = `🤖 *Análise do Assistente Preditivo:*\n_Aqui vai a minha leitura cruzando as estatísticas dos 50 jogos:_\n\n`;
              
              if(atrasosForte.length > 0) {
                  let bA = atrasosForte[0]; let dzA = bA.d < 10 ? '0'+bA.d : bA.d;
                  insight += `• *Para Fixar:* A dezena *${dzA}* atingiu seu limite de atraso. A chance matemática dela "estourar" (retornar) hoje é de *${bA.taxa}%*.\n`;
              } else { insight += `• *Para Fixar:* Não temos anomalias de atraso extremo hoje.\n`; }

              if(faltamCiclo.length > 0) {
                  insight += `• *Ciclo Atual:* Faltam as dezenas *${faltamCiclo.map(n=>n<10?'0'+n:n).join(', ')}*. O ciclo atual está no ${contC}º concurso.\n`;
              } else { insight += `• *Ciclo Atual:* O ciclo fechou! Todas as dezenas estão zeradas.\n`; }
              
              if(ciclosFechados.length > 0) {
                  let ultimosC = ciclosFechados.slice(-5).map(n => n + ' jgs').join(', ');
                  insight += `• *Histórico:* Tivemos ${ciclosFechados.length} ciclos concluídos nos 50 jogos. Duração dos últimos: *${ultimosC}*.\n`;
              }

              if(quebrasForte.length > 0) {
                  let bQ = quebrasForte[0]; let dzQ = bQ.d < 10 ? '0'+bQ.d : bQ.d;
                  insight += `• *Para Evitar:* A dezena *${dzQ}* saiu ${bQ.val} vezes seguidas. A chance dela falhar (quebrar) hoje é de *${bQ.taxa}%*.\n`;
              } else { insight += `• *Para Evitar:* Nenhuma dezena atingiu excesso crítico consecutivo.\n`; }

              insight += `• *O Mapa:* Aposte forte na *${lForte.n}*, pois essa linha está quente. A *${lFraca.n}* deu uma esfriada.\n\n`;
              insight += `🎯 *Palpite do Assistente (15 Dezenas):*\n\`${palpiteStr}\`\n_(Gerado cruzando o ciclo, fixando atrasos e evitando quebras)_\n`;

              // --- ENVIO TELEGRAM ---
              const token = process.env.TELEGRAM_TOKEN; const chatId = process.env.TELEGRAM_CHAT_ID;
              if (token && chatId) {
                  let msgIdFile = 'telegram_msg_id.txt';
                  let oldMsgId = fs.existsSync(msgIdFile) ? fs.readFileSync(msgIdFile, 'utf8').trim() : null;
                  if (oldMsgId) try { await fetch(`https://api.telegram.org/bot${token}/deleteMessage?chat_id=${chatId}&message_id=${oldMsgId}`); } catch(e) {}

                  const d = new Date(); d.setHours(d.getHours() - 3);
                  const dataAtual = ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear() + ' às ' + ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);

                  let ganhadoresTxt = 'Apurando rateio...';
                  if (ultimo.acumulou === true) ganhadoresTxt = 'Acumulou! (0 ganhadores)';
                  else if (ultimo.ganhadores > 0) ganhadoresTxt = `${ultimo.ganhadores} ganhador(es)`;
                  else if (ultimo.ganhadores === 0 && ultimo.acumulou === false) ganhadoresTxt = 'Nenhum ganhador reportado.';

                  let dezenasFormatadas = ultimo.dezenas.map(n => n < 10 ? '0'+n : n).join(' - ');

                  let texto = `🍀 *Painel Lotofácil Atualizado*\n🔄 *Última Atualização:* ${dataAtual}\n\n` +
                              `🏆 *Último Sorteio:* ${ultimo.concurso} (${ultimo.data})\n🔢 *Dezenas:* ${dezenasFormatadas}\n` +
                              `👤 *Ganhadores (15 pts):* ${ganhadoresTxt}\n💰 *Prêmio:* ${ultimo.premio ? toBRL(ultimo.premio) : 'Apurando...'}\n\n` +
                              `🔮 *Próximo Sorteio:* ${ultimo.proxConcurso} (${ultimo.proxData})\n⚠️ *Status:* Estimado em ${ultimo.proxPremio ? toBRL(ultimo.proxPremio) : 'A definir'}\n\n` +
                              `${insight}\n` +
                              `✅ *Base:* 50 Jogos (${novaTabela[novaTabela.length-1].concurso} ao ${ultimo.concurso})\n` +
                              `🔗 *Seu Painel:* https://renatocosta93.github.io/painel-loto/\n` +
                              `🏦 *Fonte Oficial:* [Caixa Econômica](https://loterias.caixa.gov.br/Paginas/Lotofacil.aspx)`;

                  try {
                      let resBot = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ chat_id: chatId, text: texto, parse_mode: 'Markdown', disable_web_page_preview: true }) });
                      let botData = await resBot.json();
                      if (botData.ok) fs.writeFileSync(msgIdFile, botData.result.message_id.toString());
                  } catch(e) {}
              }
          }
          run();
          EOF
          node script.js
      - name: Publicar
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Robo Lotofacil"
          git add resultados.json telegram_msg_id.txt || true
          git commit -m "Auto: Ciclos Historicos e Assistente Preditivo" || echo "Sem mudanças"
          git push
