name: Atualizador Diário
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Motor de Sincronizacao de Dados Ricos
        run: |
          cat << 'EOF' > script.js
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';
          const fs = require('fs');

          async function fetchLoto(concurso = '') {
              const endpoint = concurso ? `/${concurso}` : '';
              const urls = [
                  `https://brasilapi.com.br/api/loterias/v1/lotofacil${endpoint}`,
                  `https://loterias-api.brchallenges.com/api/lotofacil${endpoint}`,
                  `https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil${endpoint}`
              ];
              
              for (let u of urls) {
                  try {
                      let res = await fetch(u, { 
                          headers: { 
                              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
                              'Accept': 'application/json'
                          },
                          signal: AbortSignal.timeout(6000)
                      });
                      if (res.ok) {
                          let data = await res.json();
                          let num = data.concurso || data.numero;
                          let dezenas = data.dezenas || data.listaDezenas;
                          let dataSorteio = data.data || data.dataApuracao;
                          
                          if (num && dezenas && dezenas.length === 15) {
                              let acumulou = data.acumulou || false;
                              let ganhadores15 = 0;
                              let premio15 = 0;
                              
                              if (data.premiacao && data.premiacao.length > 0) {
                                  ganhadores15 = data.premiacao[0].vencedores || data.premiacao[0].ganhadores || 0;
                                  premio15 = data.premiacao[0].premio || data.premiacao[0].valorPremio || 0;
                              }
                              
                              return {
                                  concurso: num,
                                  data: dataSorteio,
                                  dezenas: (typeof dezenas[0] === 'string' ? dezenas.map(Number) : dezenas).sort((a,b)=>a-b),
                                  acumulou: acumulou,
                                  ganhadores: ganhadores15,
                                  premio: premio15,
                                  proxConcurso: data.proximoConcurso || data.numeroConcursoProximo || (num + 1),
                                  proxData: data.dataProximoConcurso || data.dataProximoSorteio || "A definir",
                                  proxPremio: data.valorEstimadoProximoConcurso || data.valorEstimadoProximoSorteio || 0
                              };
                          }
                      }
                  } catch (e) {}
              }
              return null;
          }

          async function run() {
              console.log("Iniciando varredura com captura de prêmios...");
              let historico = [];
              if (fs.existsSync('resultados.json')) {
                  try {
                      let txt = fs.readFileSync('resultados.json', 'utf8');
                      if(txt.trim()) historico = JSON.parse(txt);
                  } catch(e) {}
              }

              let ultimo = await fetchLoto('');
              if (!ultimo) {
                  console.log("Erro Crítico: Todas as APIs bloqueadas.");
                  process.exit(1);
              }

              let mapHist = {};
              for (let j of historico) {
                  if (j && j.concurso) mapHist[j.concurso] = j;
              }

              let novaTabela = [];
              for (let i = 0; i < 50; i++) {
                  let alvo = ultimo.concurso - i;
                  if (alvo < 1) break;
                  
                  // Injeta os dados ricos sempre no concurso mais recente (posição 0)
                  if (i === 0) {
                      novaTabela.push(ultimo);
                  } else if (mapHist[alvo] && mapHist[alvo].dezenas) {
                      novaTabela.push(mapHist[alvo]);
                  } else {
                      let draw = await fetchLoto(alvo);
                      if (draw) novaTabela.push(draw);
                      await new Promise(r => setTimeout(r, 800));
                  }
              }

              if (novaTabela.length > 0) {
                  fs.writeFileSync('resultados.json', JSON.stringify(novaTabela, null, 2));
                  console.log(`Sucesso: Atualizado com os dados do concurso ${ultimo.concurso}`);
              } else {
                  process.exit(1);
              }
          }
          run();
          EOF
          node script.js
      - name: Publicar Tabela Consolidada
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Robo Lotofacil"
          git add resultados.json
          git commit -m "Auto: Tabela atualizada com prêmios e ganhadores" || echo "Sem mudanças"
          git push
